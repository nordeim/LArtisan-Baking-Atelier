# ============================================
# L'Artisan Baking Atelier - Development Overrides
# Used automatically by docker-compose for local development
# ============================================

version: '3.8'

services:
  app:
    build:
      target: dev
    volumes:
      - .:/app:delegated
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      # Override with development credentials
      DATABASE_URL: postgresql://artisan:artisan_dev@postgres:5432/artisan_atelier?schema=public
      JWT_SECRET: dev-jwt-secret-do-not-use-in-production-32chars
    command: npm run dev
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  postgres:
    environment:
      POSTGRES_PASSWORD: artisan_dev
    ports:
      - "5432:5432"  # Expose to host for debugging
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"  # Expose to host for debugging

  # Add mailpit for email testing
  mailpit:
    image: axllent/mailpit
    container_name: artisan_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - artisan_network
    environment:
      MP_DATA_FILE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

volumes:
  postgres_dev_data:
    name: artisan_postgres_dev_data
  mailpit_data:
    name: artisan_mailpit_data
