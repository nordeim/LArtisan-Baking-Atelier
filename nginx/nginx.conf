# ============================================
# L'Artisan Baking Atelier - Nginx Configuration
# Production reverse proxy with SSL, compression, and caching
# ============================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================
    # Logging Format
    # ============================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ============================================
    # Performance Settings
    # ============================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ============================================
    # Gzip Compression
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # ============================================
    # Rate Limiting Zones
    # ============================================
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=checkout:10m rate=1r/s;

    # ============================================
    # SSL Settings
    # ============================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ============================================
    # Upstream Configuration (App Servers)
    # ============================================
    upstream app_servers {
        least_conn;
        server app:3000 max_fails=3 fail_timeout=30s;
        # Add more replicas as needed
        # server app2:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ============================================
    # HTTP to HTTPS Redirect
    # ============================================
    server {
        listen 80;
        listen [::]:80;
        server_name artisan-baking.com www.artisan-baking.com;
        
        # Health check endpoint (for load balancers)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ============================================
    # Main HTTPS Server
    # ============================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name artisan-baking.com www.artisan-baking.com;

        # SSL Certificates
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' https://images.unsplash.com https://*.googleusercontent.com data:; connect-src 'self' https://api.stripe.com https://*.sentry.io; frame-src https://js.stripe.com https://hooks.stripe.com; font-src 'self';" always;

        # ============================================
        # Static Asset Caching
        # ============================================
        location /_next/static {
            proxy_pass http://app_servers;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, immutable";
            expires 1y;
            access_log off;
        }

        location /static {
            proxy_pass http://app_servers;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public";
            expires 30d;
            access_log off;
        }

        # ============================================
        # Rate Limited Endpoints
        # ============================================
        location /api/auth {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://app_servers;
            include /etc/nginx/proxy_params;
        }

        location /api/checkout {
            limit_req zone=checkout burst=5 nodelay;
            proxy_pass http://app_servers;
            include /etc/nginx/proxy_params;
        }

        location /api {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://app_servers;
            include /etc/nginx/proxy_params;
        }

        # ============================================
        # Webhook Endpoints (No Rate Limit)
        # ============================================
        location /api/webhooks {
            proxy_pass http://app_servers;
            include /etc/nginx/proxy_params;
        }

        # ============================================
        # Health Check
        # ============================================
        location /health {
            access_log off;
            proxy_pass http://app_servers/api/health;
            include /etc/nginx/proxy_params;
        }

        # ============================================
        # Main Application
        # ============================================
        location / {
            proxy_pass http://app_servers;
            include /etc/nginx/proxy_params;
        }
    }
}
